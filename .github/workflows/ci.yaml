name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # The same OpenNext build `alchemy deploy` runs, minus the deploy. There is
      # no wrangler config to read, so the check for one is skipped.
      - name: Build Cloudflare Workers bundle
        run: bunx opennextjs-cloudflare build --skipWranglerConfigCheck
